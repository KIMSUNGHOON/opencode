# Code QA Workflow Settings
# All workflow configuration values are managed in this file.

# =============================================================================
# Timeout Settings (milliseconds)
# =============================================================================
timeout:
  # Per-agent Task timeout
  agent:
    env-setup: 60000        # 1 min (environment detection)
    git-input: 30000        # 30 sec (Git parsing)
    pre-checker: 120000     # 2 min (Lint/Format)
    code-reviewer: 300000   # 5 min (code analysis)
    code-fixer: 300000      # 5 min (code fix)
    quality-checker: 180000 # 3 min (quality check)
    build-tester: 600000    # 10 min (build test)
    function-tester: 600000 # 10 min (function test)
    git-committer: 60000    # 1 min (Git commit)
    summary-reporter: 120000 # 2 min (report generation)
    git-pusher: 120000      # 2 min (Push/PR)

  # Overall workflow timeout
  workflow: 3600000         # 1 hour

  # User input wait timeout (milliseconds)
  # Prevents deadlock when user doesn't respond to WAITING_INPUT prompts.
  # After timeout, Orchestrator takes default action per agent:
  #   env-setup     → auto-confirm detected environment
  #   build-tester  → auto-confirm current environment
  #   function-tester → auto-skip tests
  #   git-committer → auto-skip commit
  #   git-pusher    → auto-skip push
  user_input: 300000          # 5 min (0 = unlimited, NOT recommended)

# =============================================================================
# Retry Settings
# =============================================================================
retry:
  # Task call retry
  task:
    max_attempts: 3         # Maximum retry count
    delay_ms: 2000          # Retry interval (milliseconds)
    backoff_multiplier: 2   # Exponential backoff multiplier

  # Regression loop retry (P0: per-source independent counters)
  regression:
    per_source_max: 3       # Max retries per source (quality, build, test)
    total_cap: 5            # Max total regressions across ALL sources
    timeout_guard: 0.85     # Skip regression if elapsed > 85% of workflow timeout

  # Token parsing failure retry
  parse:
    max_attempts: 2

# =============================================================================
# Quality Criteria
# =============================================================================
quality:
  # Minimum quality score (regress if below this score)
  threshold: 70

  # Score calculation weights
  weights:
    critical: 20            # Points deducted per Critical issue
    high: 10                # Points deducted per High issue
    medium: 5               # Points deducted per Medium issue
    low: 1                  # Points deducted per Low issue

  # Default score on parsing failure
  default_score: 50

# =============================================================================
# Model Settings (Single Model (GLM-4.7-FP8))
# =============================================================================
model:
  # Single model for all agents
  model: "glm/GLM-4.7-FP8"

  # Fallback model
  fallback: "glm/GLM-4.7-FP8"

  # Per-agent model assignment
  assignment:
    # All agents use the same GLM-4.7-FP8 model
    all_agents:
      - code-qa          # Orchestrator
      - env-setup          # Phase -1: Environment detection
      - git-input          # Phase 0: Git parsing
      - workspace-analyzer # Phase 0B: File structure analysis
      - pre-checker        # Phase 1: Lint/Format
      - code-reviewer      # Phase 2: Deep code analysis (CoT)
      - code-fixer         # Phase 3: Code fix (SWE-Bench)
      - quality-checker    # Phase 4: Quality evaluation/scoring
      - build-tester       # Phase 5: Build test
      - function-tester    # Phase 6: Function test
      - git-committer      # Phase 7: Git commit
      - summary-reporter   # Phase 8: Comprehensive report generation
      - git-pusher         # Phase 9: Push/PR
      - file-input         # Direct file input

  # Model ID validation (P2-1: prevent routing failures)
  # All QA workflow agents MUST use model IDs matching this format:
  #   {provider}/{model-name}
  # Valid provider for QA workflow: "glm"
  # Non-QA commands (commit, issues, triage) may use other providers.
  validation:
    required_format: "{provider}/{model-name}"
    valid_providers:
      - "glm"            # GLM model provider
    health_check:
      endpoint: "http://localhost:8000/v1/models"
      timeout_ms: 5000   # Health check timeout

  # Output token cap override
  # OpenCode hard-caps output at 32K (llm.ts OUTPUT_TOKEN_MAX).
  # GLM-4.7-FP8 supports 131K. Set this env var before launching:
  #   export OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX=131072
  output_token_max_env: "OPENCODE_EXPERIMENTAL_OUTPUT_TOKEN_MAX=131072"

  # Context settings
  context:
    max_length: 200000      # Maximum context length (200K for GLM-4.7)
    reduce_ratio: 0.5       # Reduction ratio on OOM

  # Sampling parameters (Z.ai official recommendation)
  sampling:
    temperature: 1.0
    top_p: 0.95

# =============================================================================
# Docker Sandbox Settings
# =============================================================================
sandbox:
  enabled: true
  image_name: "qa-sandbox"
  dockerfile: ".opencode/docker/Dockerfile.sandbox"
  gpu: true
  build_timeout: 600000     # 10 min
  test_timeout: 600000      # 10 min

# =============================================================================
# Git Settings
# =============================================================================
git:
  # Commit settings
  commit:
    auto_stage: true        # Auto staging
    message_prefix: ""      # Commit message prefix
    message_suffix: "\n\nCode-QA: auto-fixed"  # Commit message suffix

  # Push settings
  push:
    force_with_lease: true  # Use --force-with-lease on amend
    create_pr: true         # Auto-create PR (with user confirmation)

# =============================================================================
# Logging Settings
# =============================================================================
logging:
  level: "INFO"             # DEBUG, INFO, WARN, ERROR
  format: "structured"      # plain, structured
  include_timestamp: true
  include_agent_name: true

# =============================================================================
# File Filter Settings
# =============================================================================
filter:
  # File extensions to include
  include:
    - "*.py"
    - "*.js"
    - "*.ts"
    - "*.jsx"
    - "*.tsx"
    - "*.go"
    - "*.rs"
    - "*.java"
    - "*.kt"
    - "*.c"
    - "*.cpp"
    - "*.h"
    - "*.hpp"
    - "*.rb"
    - "*.php"
    - "*.swift"
    - "*.scala"
    - "*.sh"

  # Paths to exclude
  exclude:
    - "node_modules/"
    - "venv/"
    - ".venv/"
    - "__pycache__/"
    - ".mypy_cache/"
    - ".ruff_cache/"
    - ".pytest_cache/"
    - ".tox/"
    - ".nox/"
    - ".opencode/"
    - "target/"
    - "build/"
    - "dist/"
    - ".git/"
    - "*.min.js"
    - "*.bundle.js"
    - "*.lock"
