# Code QA Workflow Settings
# 이 파일에서 워크플로우의 모든 설정 값을 관리합니다.

# =============================================================================
# 타임아웃 설정 (밀리초)
# =============================================================================
timeout:
  # Agent별 Task 타임아웃
  agent:
    env-setup: 60000        # 1분 (환경 감지)
    git-input: 30000        # 30초 (Git 파싱)
    pre-checker: 120000     # 2분 (Lint/Format)
    code-reviewer: 300000   # 5분 (코드 분석)
    code-fixer: 300000      # 5분 (코드 수정)
    quality-checker: 180000 # 3분 (품질 검사)
    build-tester: 600000    # 10분 (빌드 테스트)
    function-tester: 600000 # 10분 (기능 테스트)
    git-committer: 60000    # 1분 (Git 커밋)
    summary-reporter: 120000 # 2분 (리포트 생성)
    git-pusher: 120000      # 2분 (Push/PR)

  # 전체 워크플로우 타임아웃
  workflow: 3600000         # 1시간

  # 사용자 입력 대기 타임아웃 (0 = 무제한)
  user_input: 0

# =============================================================================
# 재시도 설정
# =============================================================================
retry:
  # Task 호출 재시도
  task:
    max_attempts: 3         # 최대 재시도 횟수
    delay_ms: 2000          # 재시도 간격 (밀리초)
    backoff_multiplier: 2   # 지수 백오프 승수

  # 회귀 루프 재시도 (quality < 70 또는 build/test 실패)
  regression:
    max_attempts: 3         # 최대 회귀 횟수

  # 토큰 파싱 실패 시 재시도
  parse:
    max_attempts: 2

# =============================================================================
# 품질 기준
# =============================================================================
quality:
  # 최소 품질 점수 (이 점수 미만이면 회귀)
  threshold: 70

  # 점수 계산 가중치
  weights:
    critical: 20            # Critical 이슈 1개당 감점
    high: 10                # High 이슈 1개당 감점
    medium: 5               # Medium 이슈 1개당 감점
    low: 1                  # Low 이슈 1개당 감점

  # 파싱 실패 시 기본 점수
  default_score: 50

# =============================================================================
# 모델 설정
# =============================================================================
model:
  # 기본 모델
  default: "qwen/qwen3-next-80b-a3b-thinking"

  # Context 설정
  context:
    max_length: 262144      # 최대 Context 길이
    reduce_ratio: 0.5       # OOM 시 축소 비율

  # 샘플링 파라미터
  sampling:
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    min_p: 0

# =============================================================================
# Docker Sandbox 설정
# =============================================================================
sandbox:
  enabled: true
  image_name: "qa-sandbox"
  dockerfile: ".opencode/docker/Dockerfile.sandbox"
  gpu: true
  build_timeout: 600000     # 10분
  test_timeout: 600000      # 10분

# =============================================================================
# Git 설정
# =============================================================================
git:
  # 커밋 설정
  commit:
    auto_stage: true        # 자동 스테이징
    message_prefix: ""      # 커밋 메시지 접두사
    message_suffix: "\n\nCode-QA: auto-fixed"  # 커밋 메시지 접미사

  # Push 설정
  push:
    force_with_lease: true  # amend 시 --force-with-lease 사용
    create_pr: true         # PR 자동 생성 여부 (사용자 확인)

# =============================================================================
# 로깅 설정
# =============================================================================
logging:
  level: "INFO"             # DEBUG, INFO, WARN, ERROR
  format: "structured"      # plain, structured
  include_timestamp: true
  include_agent_name: true

# =============================================================================
# 파일 필터 설정
# =============================================================================
filter:
  # 포함할 파일 확장자
  include:
    - "*.py"
    - "*.js"
    - "*.ts"
    - "*.jsx"
    - "*.tsx"
    - "*.go"
    - "*.rs"
    - "*.java"
    - "*.kt"
    - "*.c"
    - "*.cpp"
    - "*.h"
    - "*.hpp"
    - "*.rb"
    - "*.php"
    - "*.swift"
    - "*.scala"
    - "*.sh"

  # 제외할 경로
  exclude:
    - "node_modules/"
    - "venv/"
    - "__pycache__/"
    - "target/"
    - "build/"
    - "dist/"
    - ".git/"
    - "*.min.js"
    - "*.bundle.js"
    - "*.lock"
